name: departi
description: Travel-compliance intelligence and curated booking for digital nomads — permit-aware Schengen tracking, tax-residency analysis, visa requirements, and persona-curated accommodation, transport, and experience search across 189 European destinations.
vendor: Departi
sourceUrl: https://github.com/Departi/mcp-server
homepage: https://departi.eu
documentation: https://departi.eu/developers/mcp

startCommand:
  type: http
  configSchema:
    type: object
    properties:
      url:
        type: string
        default: "https://mcp.departi.eu/v3"
        description: "MCP endpoint URL. Use /v3 for anonymous access or /v3/oauth for personalized results."
